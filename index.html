<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango Mustard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background: radial-gradient(circle at center, #2b1a00 0%, #120800 100%);

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    /* giant glowing 67 */
    .bg-number {
      position: absolute;
      font-size: 35vw;
      font-weight: 900;
      color: rgba(255, 208, 0, 0.08);

      text-shadow:
        0 0 40px rgba(255, 217, 0, 0.4),
        0 0 80px rgba(255, 217, 0, 0.3),
        0 0 140px rgba(255, 217, 0, 0.2);

      z-index: 0;
      user-select: none;
    }

    /* center text */
    .title {
      position: relative;
      z-index: 2;

      text-align: center;

      font-size: 6rem;
      font-weight: 900;
      color: #ffd54a;

      text-shadow:
        0 0 10px #ffd000,
        0 0 20px #ffd000,
        0 0 40px #ffb300,
        0 0 80px #ffb300;

      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.03);
      }
    }

    /* floating mangos */
    .mango {
      position: absolute;
      font-size: 3rem;
      z-index: 1;

      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 10px gold);
    }

    .m1 { top: 10%; left: 15%; animation-delay: 0s; }
    .m2 { top: 20%; right: 12%; animation-delay: 1s; }
    .m3 { bottom: 18%; left: 20%; animation-delay: 2s; }
    .m4 { bottom: 10%; right: 18%; animation-delay: 3s; }
    .m5 { top: 50%; left: 5%; animation-delay: 4s; }
    .m6 { top: 55%; right: 6%; animation-delay: 5s; }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(10deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }
  </style>
</head>

<body>
  <div class="bg-number">67</div>

  <div class="mango m1">🥭</div>
  <div class="mango m2">🥭</div>
  <div class="mango m3">🥭</div>
  <div class="mango m4">🥭</div>
  <div class="mango m5">🥭</div>
  <div class="mango m6">🥭</div>

  <div class="title">
    Mango + Mustard
  </div>
</body>
</html>
